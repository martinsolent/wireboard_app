<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wireboard Tutorial</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #e9ecf1;
      color: #1b2130;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { width: min(100%, 960px); }
    h1 { margin: 0 0 16px; }
    iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 8px;
      background: #13161c;
    }
  </style>
</head>
<body>
  <main>
    <h1>Wireboard Tutorial</h1>
    <iframe
      src="./wireboard-promo.mp4"
      title="Wireboard tutorial video"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
